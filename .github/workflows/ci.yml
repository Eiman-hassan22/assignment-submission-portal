```yaml
name: Assignment Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-report:
    runs-on: self-hosted

    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@v4

      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        id: tests
        continue-on-error: true
        run: python -m pytest -v --json-report --json-report-file=pytest-report.json

      - name: Build and send actual test report
        if: always()
        env:
          REPORT_RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
        run: python make_report.py

      - name: Fail pipeline if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Automated tests failed."
          exit 1

  deploy:
    needs: test-and-report
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Create Pages website
        run: |
          mkdir -p public
          echo '<!DOCTYPE html>' > public/index.html
          echo '<html>' >> public/index.html
          echo '<head><title>Assignment Submission Portal</title></head>' >> public/index.html
          echo '<body>' >> public/index.html
          echo '<h1>Assignment Submission Portal</h1>' >> public/index.html
          echo '<p>Deployment successful.</p>' >> public/index.html
          echo '<p>All automated tests passed.</p>' >> public/index.html
          echo '<p>Deployed through GitHub Actions.</p>' >> public/index.html
          echo '</body>' >> public/index.html
          echo '</html>' >> public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
