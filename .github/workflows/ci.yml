name: Assignment Portal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  test-and-report:
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest -v --json-report --json-report-file=pytest-report.json

      - name: Create and send report
        if: always()
        env:
          REPORT_RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
        run: python make_report.py

      - name: Email test report
        if: always()
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python send_email.py

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1


  deploy:
    needs: test-and-report
    if: success()
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create website
        run: |
          mkdir -p public
          echo '<!DOCTYPE html>' > public/index.html
          echo '<html>' >> public/index.html
          echo '<head><title>Assignment Submission Portal</title></head>' >> public/index.html
          echo '<body>' >> public/index.html
          echo '<h1>Assignment Submission Portal</h1>' >> public/index.html
          echo '<p>Deployment successful.</p>' >> public/index.html
          echo '<p>All automated tests passed.</p>' >> public/index.html
          echo '</body>' >> public/index.html
          echo '</html>' >> public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4